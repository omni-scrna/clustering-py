[workspace]
authors = ["Atreya Choudhury"]
channels = ["conda-forge"]
name = "clustering-py"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]
export-env = "pixi workspace export conda-environment --name $(basename $(git rev-parse --show-toplevel)) envs/clustering-py.yml && sed -i '1s/^/# this file was auto-generated by pixi - do not edit by hand\\n/' envs/clustering-py.yml"

[dependencies]
python = "3.11.*"
scikit-learn = "*"
numpy = "*"
polars = "*"

# env for quick dev tasks - avoid the regular deps
[feature.dev.dependencies]
python = ">=3.11"
pyyaml = ">=6"
curl = "*"

[feature.dev.tasks]
sync = "sh -c 'curl -fsSL https://raw.githubusercontent.com/omni-scrna/boilerplate/${BRANCH:-main}/scripts/pull.py | python -'"

[environments]
dev = { features = ["dev"], no-default-feature = true }
